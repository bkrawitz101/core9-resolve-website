<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CORE9 RESOLVE™</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#272b29;background:#f7f4ed}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:38px auto;padding:0 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:750;letter-spacing:.12em;font-size:14px}.langs{display:flex;gap:5px}.langs button{background:white;color:#302d27;border:1px solid #c9c3b7;padding:9px 15px;border-radius:9px;cursor:pointer}.langs button[aria-pressed=true]{background:#403b32;color:white}.panel{margin-top:30px;background:white;border:1px solid #e5e0d6;border-radius:20px;padding:clamp(24px,5vw,45px);box-shadow:0 15px 38px #342c1c0a}h1{font-size:clamp(29px,5vw,43px);line-height:1.15;margin:10px 0 18px}p{line-height:1.6;color:#5b5953}.eyebrow{color:#987a4e;font-size:12px;letter-spacing:.12em;font-weight:700}.question{font-size:clamp(21px,4vw,29px);line-height:1.4;font-weight:600;margin:32px 0}.progress{height:7px;background:#eeeae2;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#a98a5a;transition:width .2s}.choices{display:grid;gap:10px}.choices button{font:inherit;text-align:left;background:#faf9f6;border:1px solid #d9d2c7;border-radius:12px;padding:15px 17px;cursor:pointer;color:#272b29}.choices button.selected{border:2px solid #876b40;background:#f4eee3}.actions{display:flex;gap:12px;align-items:center;margin-top:25px;flex-wrap:wrap}button.primary{font:inherit;background:#403b32;color:white;border:0;border-radius:10px;padding:13px 20px;cursor:pointer}button.secondary{font:inherit;background:transparent;color:#403b32;border:1px solid #c9c3b7;border-radius:10px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.note{font-size:13px;color:#79746a;margin-top:20px}.hidden{display:none}.review{margin:16px 0;padding:12px 15px;background:#f7f4ed;border-radius:9px}.review b{font-weight:600}#clientReport h3{font-size:19px;margin-top:27px}#clientReport p{white-space:pre-line}#reportControls{margin:20px 0}#lifeArea{display:block;margin-top:8px;padding:10px;width:100%;border:1px solid #c9c3b7;border-radius:8px;font:inherit}details{margin-top:24px}summary{cursor:pointer}a{color:#735b37}.footer{margin-top:28px;font-size:13px;color:#6c655b}</style></head><body><main><div class="top"><div class="brand">CORE9 RESOLVE™</div><div class="langs"><button id="en" aria-pressed="true" onclick="setLang('en')">EN</button><button id="ru" aria-pressed="false" onclick="setLang('ru')">RU</button></div></div><div class="panel"><div class="eyebrow" id="eyebrow"></div><section id="intro"><h1 id="title"></h1><p id="description"></p><button class="primary" id="start" onclick="start()"></button></section><section id="quiz" class="hidden"><div id="counter"></div><div class="progress"><div id="fill"></div></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="actions"><button class="secondary" id="back" onclick="back()"></button><button class="primary" id="next" onclick="next()"></button></div></section><section id="end" class="hidden"><h1 id="endtitle"></h1><p id="enddesc"></p><div id="reportControls" class="hidden"><label for="lifeArea">Which part of life would you like to explore?</label><select id="lifeArea" onchange="chosenArea=this.value;renderReport()"></select></div><div id="clientReport"></div><details id="answerDetails"><summary>Review your answers / Посмотреть ответы</summary><div id="review"></div></details><div class="actions"><button class="secondary" id="edit" onclick="edit()"></button><button class="primary" id="copy" onclick="copyAnswers()"></button></div><p class="note" id="disclaimer"></p></section></div><div class="footer"><a href="index.html" id="home"></a> · <a id="original" href="#"></a></div></main><script>
const questions=[{"number": 1, "function": 1, "dimension": 1, "ru": "Меня вдохновляет мысль, что моя жизнь может быть гораздо интереснее и богаче возможностями, чем сегодня. Мне хочется заглянуть за горизонт привычного и открыть для себя новые перспективы.", "en": "I’m inspired by the thought that my life could be far more interesting and full of possibilities than it is today. I want to look beyond what’s familiar and discover new horizons."}, {"number": 2, "function": 1, "dimension": 2, "ru": "Я исследую разные варианты развития своей жизни, обращаюсь к опыту других людей, сравниваю возможности и выстраиваю собственную стратегию движения вперёд.", "en": "I explore different directions my life could take, learn from other people’s experiences, weigh my options, and develop my own strategy for moving forward."}, {"number": 3, "function": 1, "dimension": 3, "ru": "Я вижу, каким хочу сделать своё будущее, уже осуществил(а) некоторые свои замыслы и чувствую воодушевление от того, что у меня получается", "en": "I have a vision of the future I want to create. I’ve already brought some of my ideas to life, and I feel excited about what I’m accomplishing."}, {"number": 4, "function": 2, "dimension": 1, "ru": "Мне интересно понимать, что чувствуют и думают другие люди, находить с ними общий язык и открывать новые возможности для близости, дружбы и сотрудничества.", "en": "I’m curious about what other people think and feel. I enjoy finding common ground and discovering new possibilities for closeness, friendship, and collaboration."}, {"number": 5, "function": 2, "dimension": 2, "ru": "Я стараюсь услышать другого человека, понять его желания и найти решение, в котором учитываются и его интересы, и мои собственные.", "en": "I make an effort to truly hear another person, understand what they want, and find solutions that respect both their interests and my own."}, {"number": 6, "function": 2, "dimension": 3, "ru": "Мне удаётся создавать отношения, в которых мы слышим, уважаем и поддерживаем друг друга. Я чувствую радость от близости и сотрудничества, не теряя при этом себя.", "en": "I’m able to build relationships in which we listen to, respect, and support one another. I enjoy closeness and collaboration without losing my sense of self."}, {"number": 7, "function": 3, "dimension": 1, "ru": "Когда что-то не получается, во мне просыпается любопытство: хочется докопаться до причины, а не просто махнуть рукой.", "en": "When something doesn’t work out, it sparks my curiosity. I want to understand why rather than simply give up."}, {"number": 8, "function": 3, "dimension": 2, "ru": "Я собираю факты, сопоставляю разные объяснения, замечаю закономерности и проверяю свои догадки.", "en": "I gather facts, compare different explanations, notice patterns, and test my assumptions."}, {"number": 9, "function": 3, "dimension": 3, "ru": "Мне удаётся находить причины повторяющихся проблем и менять ситуацию так, чтобы они переставали мешать моей жизни.", "en": "I’m able to identify the causes of recurring problems and change things so those problems no longer get in the way of my life."}, {"number": 10, "function": 4, "dimension": 1, "ru": "Меня увлекает возможность узнавать новое, находить неожиданные объяснения привычным вещам и открывать перспективы, о которых я раньше даже не задумывался(лась).", "en": "I love learning new things, discovering unexpected explanations for familiar experiences, and seeing possibilities I had never considered before."}, {"number": 11, "function": 4, "dimension": 2, "ru": "Я изучаю интересующие меня вопросы, сравниваю разные возможности, определяю цели и выбираю, чему сейчас действительно стоит уделить внимание.", "en": "I explore subjects that interest me, compare opportunities, set goals, and decide what truly deserves my attention right now."}, {"number": 12, "function": 4, "dimension": 3, "ru": "Я последовательно достигаю своих целей, используя знания и открывая новые возможности для материального и духовного развития.", "en": "I make steady progress toward my goals by applying what I know and opening up new opportunities for material and spiritual growth."}, {"number": 13, "function": 5, "dimension": 1, "ru": "Мне хочется не просто разговаривать с людьми, а чувствовать, что мои мысли находят отклик и между нами возникает настоящее понимание.", "en": "I want more than just conversations. I want to feel that my thoughts resonate with others and that we genuinely understand one another."}, {"number": 14, "function": 5, "dimension": 2, "ru": "Я ищу подходящие слова, задаю вопросы, делюсь идеями и пробую разные способы общения, когда меня понимают не сразу.", "en": "I look for the right words, ask questions, share ideas, and try different ways of communicating when people don’t understand me right away."}, {"number": 15, "function": 5, "dimension": 3, "ru": "Мне удаётся ясно доносить свои мысли, достигать взаимопонимания и превращать разговоры в договорённости и совместные действия.", "en": "I’m able to express my thoughts clearly, build mutual understanding, and turn conversations into agreements and shared action."}, {"number": 16, "function": 6, "dimension": 1, "ru": "Меня манит возможность жить ярче: больше радоваться, удивляться, придумывать новое и не откладывать удовольствие от жизни на потом.", "en": "I’m drawn to the possibility of living more fully: finding more joy, feeling a sense of wonder, creating something new, and not putting off the pleasures of life."}, {"number": 17, "function": 6, "dimension": 2, "ru": "Я прислушиваюсь к своим желаниям, экспериментирую, создаю что-то по-своему и нахожу время для занятий, которые меня вдохновляют.", "en": "I pay attention to what I want, experiment, create things in my own way, and make time for activities that inspire me."}, {"number": 18, "function": 6, "dimension": 3, "ru": "В моей жизни есть место творчеству, удовольствию и новым впечатлениям. Я чувствую, что могу проявлять себя, а не только выполнять обязанности.", "en": "My life has room for creativity, enjoyment, and new experiences. I feel free to express who I am, rather than only fulfill obligations."}, {"number": 19, "function": 7, "dimension": 1, "ru": "Иногда меня так захватывает новая идея, что хочется немедленно попробовать, даже если я ещё не знаю, как всё получится.", "en": "Sometimes a new idea excites me so much that I want to try it immediately, even before I know how it will turn out."}, {"number": 20, "function": 7, "dimension": 2, "ru": "Я проявляю инициативу, вовлекаю других, нахожу неожиданные возможности и делаю первые шаги, не дожидаясь идеальных условий.", "en": "I take initiative, bring others on board, spot unexpected opportunities, and take the first steps without waiting for perfect conditions."}, {"number": 21, "function": 7, "dimension": 3, "ru": "Благодаря моей инициативе появляются новые занятия, проекты, знакомства или возможности, которых раньше в моей жизни не было.", "en": "My initiative leads to new activities, projects, connections, or opportunities that weren’t part of my life before."}, {"number": 22, "function": 8, "dimension": 1, "ru": "Мне нравится представлять, как из идеи рождается что-то настоящее, чем можно пользоваться, наслаждаться или делиться с другими.", "en": "I enjoy imagining how an idea could become something real—something people can use, enjoy, or share."}, {"number": 23, "function": 8, "dimension": 2, "ru": "Я подбираю материалы и инструменты, организую работу, совершенствую детали и довожу начатое до завершения.", "en": "I choose materials and tools, organize the work, refine the details, and follow through until the job is finished."}, {"number": 24, "function": 8, "dimension": 3, "ru": "В моей жизни появляются созданные мной вещи, работающие решения или материальные достижения, которыми я могу пользоваться и гордиться.", "en": "My life includes things I’ve created, solutions that work, or tangible achievements I can use and take pride in."}, {"number": 25, "function": 9, "dimension": 1, "ru": "Меня привлекает возможность разобраться даже в сложной ситуации, найти выход и помочь человеку там, где другие не знают, что предпринять.", "en": "I’m drawn to the challenge of making sense of even a difficult situation, finding a way forward, and helping someone when others don’t know what to do."}, {"number": 26, "function": 9, "dimension": 2, "ru": "Я замечаю, кому необходима поддержка, оцениваю обстоятельства, нахожу подходящий способ помочь и предпринимаю конкретные шаги.", "en": "I notice when someone needs support, assess the circumstances, find an appropriate way to help, and take concrete steps."}, {"number": 27, "function": 9, "dimension": 3, "ru": "Мне удаётся защищать людей, помогать им выходить из трудных ситуаций и доводить начатое до конца. Я вижу пользу своих действий и испытываю удовлетворение от достигнутого.", "en": "I’m able to protect people, help them through difficult situations, and see things through to the end. I can see the value of what I’ve done and feel satisfied with the outcome."}], L={"en": "From Potential to Reality", "ru": "От возможностей к результатам", "intro_en": "Explore the journey from interest and potential to action and meaningful results.", "intro_ru": "Исследуйте путь от интереса и возможностей к действиям и результатам.", "opts_en": ["1 — Not at all true", "2 — Mostly untrue", "3 — Partly true", "4 — Mostly true", "5 — Very true"], "opts_ru": ["1 — Совсем не похоже", "2 — Скорее не похоже", "3 — Отчасти похоже", "4 — Скорее похоже", "5 — Очень похоже"]};let lang='en',pos=0,answers=Array(questions.length).fill(null);const $=id=>document.getElementById(id);const dict={en:{start:'Start the test',back:'Previous',next:'Next',finish:'Review answers',question:'Question',end:'Your responses',enddesc:'Your answers are recorded in this preview. The approved test-specific interpretation will be integrated separately; no automatic conclusions are being substituted.',edit:'Edit responses',copy:'Copy responses',disclaimer:'Website integration preview. This screen does not replace the approved Russian results or interpretation logic.',home:'All assessments',original:'Original Russian test',notanswered:'Please select an answer before continuing.'},ru:{start:'Начать тест',back:'Назад',next:'Далее',finish:'Просмотреть ответы',question:'Вопрос',end:'Ваши ответы',enddesc:'Ответы сохранены в этой предварительной версии. Утверждённая интерпретация будет интегрирована отдельно, без замены методологии.',edit:'Изменить ответы',copy:'Скопировать ответы',disclaimer:'Предварительная интеграция. Эта страница не заменяет утверждённые русские результаты и логику интерпретации.',home:'Все тесты',original:'Исходный русский тест',notanswered:'Пожалуйста, выберите ответ.'}};let mode='intro';function setLang(x){lang=x;document.documentElement.lang=x;$('en').setAttribute('aria-pressed',x==='en');$('ru').setAttribute('aria-pressed',x==='ru');render()}function start(){mode='quiz';render()}function back(){if(pos>0)pos--;else mode='intro';render()}function next(){if(answers[pos]===null){alert(dict[lang].notanswered);return}if(pos===questions.length-1)mode='end';else pos++;render()}function edit(){mode='quiz';pos=0;render()}function choose(i){answers[pos]=i;render()}function copyAnswers(){const t=questions.map((q,i)=>`${q.code||q.number||q.id||i+1}: ${q[lang]} — ${answers[i]===null?'—':L['opts_'+lang][answers[i]]}`).join('\n');navigator.clipboard.writeText(t).then(()=>alert(lang==='en'?'Copied':'Скопировано')).catch(()=>prompt('Copy',t))}
const reportData={"reports": [{"title": "You have so much going for you. What would make your next chapter truly yours?", "body": "Your answers suggest that curiosity, effort, and achievement are coming together across different parts of your life. Take a moment to appreciate how far you've come.\n\nYet accomplishment and fulfillment aren't always the same. What would bring you a deeper sense of joy?", "question": "If you didn't need to prove anything to anyone, what would you choose for yourself?", "step": "Think about **{chosen area}**. Choose one experience you'd love to have—not because you should, but because it would bring you joy."}, {"title": "What if you didn't have to figure everything out at once?", "body": "Your responses suggest that several parts of life feel difficult right now. Finding enthusiasm, taking action, or seeing progress may take more energy than you have available.\n\nThese numbers cannot explain why. And they certainly don't define who you are.", "question": "What would bring you even a little relief, hope, or pleasure this week?", "step": "Choose something gentle and manageable in **{chosen area}**. Notice how it feels. A small experience can be a useful beginning."}, {"title": "You're giving it your all. Is life giving you back what you hoped for?", "body": "In **{focus function}**, your answers show considerable effort (**{action}/5**) but less satisfying outcomes (**{result}/5**).\n\nThat difference is worth exploring. It doesn't mean you haven't tried hard enough. Perhaps something important about the situation has been overlooked.", "question": "Where are you working the hardest—and feeling the least rewarded?", "step": "Recall one specific situation in **{chosen area}**. What did you hope would happen? What actually followed? The details may reveal a better next move."}, {"title": "Your desires are growing. Are you making enough room for them now?", "body": "You feel drawn toward something meaningful, but it hasn't found much space in your everyday life.\n\nThat doesn't mean you've lost your potential. Perhaps there's an interest, a dream, or a part of yourself waiting for more attention.", "question": "What would you love to bring into your life if you could make time for it?", "step": "In **{chosen area}**, try one gentle step that feels inviting rather than obligatory."}, {"title": "You've achieved something important. But does it still make your heart sing?", "body": "In **{focus function}**, your results are strong (**{result}/5**), while your interest is lower (**{interest}/5**).\n\nYou may be good at something that no longer brings the same excitement. Your achievements remain valuable, even when your feelings about them have changed.", "question": "What are you continuing out of habit, even as something new begins to call to you?", "step": "Think about **{chosen area}**. Hold on to what still brings satisfaction, and identify one thing you're ready to do differently."}, {"title": "Look at what you've created! What wonderful possibility haven't you explored yet?", "body": "Several of your abilities are translating into action and satisfying outcomes. You don't need to search for a hidden problem simply because you took a test.\n\nAnd even a fulfilling life can hold an unopened door.", "question": "What have you been quietly curious about but haven't allowed yourself to try?", "step": "In **{chosen area}**, build on a strength you already trust and experiment with something new."}, {"title": "What if one small discovery could change the way you see your life?", "body": "Your answers show a mixture of interests, actions, and outcomes. No single contrast tells the whole story.\n\nThat's not an empty result. It may mean the most important part of your experience can't be captured by numbers alone.", "question": "Which part of your life would you most love to understand better right now?", "step": "Start with **{focus function}** in **{chosen area}**. Name one change you'd welcome and one manageable step toward exploring it."}], "strengths": ["You can imagine a future you want—and see how your decisions are bringing you closer to it.", "You build relationships where people listen, respect one another, and work together.", "You're good at getting to the root of recurring problems and changing what happens next.", "You turn what you learn and what you choose to focus on into meaningful progress.", "Your ideas connect with people and lead to understanding, agreements, and shared action.", "You make room for creativity, enjoyment, and living in a way that feels like yours.", "Your initiative opens doors and turns possibilities into real beginnings.", "You turn ideas into things, solutions, and results you can actually use.", "Your support makes a practical difference in people's lives and helps bring difficult situations to a close."], "labels": ["Creating your future", "Relationships", "Finding patterns", "Learning and priorities", "Being heard", "Creativity and joy", "Taking initiative", "Making ideas real", "Helping and protecting"]};
const lifeAreas=['Health and well-being','Relationships and family','Work and financial results','Creativity and contribution','Life as a whole'];
let chosenArea=lifeAreas[4];
function scoreGrid(){let a=[];for(let i=0;i<9;i++)a.push(answers.slice(i*3,i*3+3).map(v=>v+1));return a}
function buildResult(){
 const g=scoreGrid();const all=g.flat();const high=all.every(v=>v>=4),low=all.every(v=>v<=2);
 const candidates=g.map((v,i)=>({i,interest:v[0],action:v[1],result:v[2],gap:v[1]-v[2],wish:v[0]-v[1]}));
 let branch,focus;
 if(high){branch=0;focus=candidates[0]}
 else if(low){branch=1;focus=candidates[0]}
 else if(candidates.some(x=>x.action>=4&&x.gap>=2)){branch=2;focus=candidates.filter(x=>x.action>=4&&x.gap>=2).sort((a,b)=>b.gap-a.gap)[0]}
 else if(candidates.some(x=>x.interest>=4&&x.wish>=2)){branch=3;focus=candidates.filter(x=>x.interest>=4&&x.wish>=2).sort((a,b)=>b.wish-a.wish)[0]}
 else if(candidates.some(x=>x.result>=4&&x.interest<=2)){branch=4;focus=candidates.find(x=>x.result>=4&&x.interest<=2)}
 else if(candidates.filter(x=>x.action>=4&&x.result>=4).length>=3){branch=5;focus=candidates.find(x=>x.action>=4&&x.result>=4)}
 else {branch=6;focus=candidates.slice().sort((a,b)=>a.result-b.result)[0]}
 const v={'focus function':reportData.labels[focus.i],'chosen area':chosenArea,'action':focus.action,'result':focus.result,'interest':focus.interest};
 const replace=t=>t.replace(/\{([^}]+)\}/g,(_,key)=>v[key]??'');
 return {branch,focus,title:replace(reportData.reports[branch].title),body:replace(reportData.reports[branch].body),question:replace(reportData.reports[branch].question),step:replace(reportData.reports[branch].step),strengths:candidates.filter(x=>x.action>=4&&x.result>=4).slice(0,2).map(x=>reportData.strengths[x.i])};
}
function renderReport(){
 const area=$('lifeArea');if(!area.options.length)lifeAreas.forEach(x=>area.add(new Option(x,x)));
 area.value=chosenArea;const r=buildResult();const container=$('clientReport');container.replaceChildren();
 const add=(tag,txt,cl)=>{const el=document.createElement(tag);el.textContent=txt;if(cl)el.className=cl;container.append(el);return el};
 add('h1',r.title);add('p',r.body);add('h3','One question worth exploring');add('p',r.question);add('h3','A step to try');add('p',r.step);
 if(r.strengths.length){add('h3','A strength you can draw on');r.strengths.forEach(x=>add('p',x))}
 add('h3','Your answers are the beginning of a journey toward making your desires real. And what you want matters.');
 add('p',"This questionnaire reveals some patterns. But it can't hear the story behind your answers.");
 add('p','A personal consultation can help you recognize what you truly want and choose a practical step toward bringing it to life.');
 add('p','These reflections come from your own answers. They do not establish causes, diagnoses, or objective assessments of ability.','note');
}

function render(){const d=dict[lang];$('eyebrow').textContent='27 QUESTIONS';$('title').textContent=L[lang];$('description').textContent=L['intro_'+lang];for(const key of ['start','back','next','edit','copy','home'])$(key).textContent=d[key];$('original').textContent=d.original;$('original').href='test27_original_ru.html';$('intro').classList.toggle('hidden',mode!=='intro');$('quiz').classList.toggle('hidden',mode!=='quiz');$('end').classList.toggle('hidden',mode!=='end');if(mode==='quiz'){$('counter').textContent=d.question+' '+(pos+1)+' / '+questions.length;$('fill').style.width=(100*(pos+1)/questions.length)+'%';$('question').textContent=questions[pos][lang];$('choices').replaceChildren();L['opts_'+lang].forEach((label,i)=>{let b=document.createElement('button');b.textContent=label;b.className=answers[pos]===i?'selected':'';b.onclick=()=>choose(i);$('choices').append(b)});$('back').textContent=d.back;$('next').textContent=pos===questions.length-1?d.finish:d.next}if(mode==='end'){$('endtitle').textContent=lang==='en'?'Your personal discovery':d.end;$('enddesc').textContent=lang==='en'?'Your answers have been transformed into a personal reflection.':d.enddesc;$('reportControls').classList.toggle('hidden',lang!=='en');$('clientReport').classList.toggle('hidden',lang!=='en');if(lang==='en')renderReport();else $('clientReport').replaceChildren();$('disclaimer').textContent=lang==='en'?'English interpretations approved by the author; automated branch selection is a provisional implementation pending methodological validation.':d.disclaimer;$('review').replaceChildren();questions.forEach((q,i)=>{let e=document.createElement('div');e.className='review';let b=document.createElement('b');b.textContent=(q.code||q.number||q.id||i+1)+'. '+q[lang];let p=document.createElement('p');p.textContent=answers[i]===null?'—':L['opts_'+lang][answers[i]];e.append(b,p);$('review').append(e)})}}render();</script></body></html>
