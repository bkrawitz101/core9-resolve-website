:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#272b29;background:#f7f4ed}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:38px auto;padding:0 20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:750;letter-spacing:.12em;font-size:14px}.langs{display:flex;gap:5px}.langs button{background:white;color:#302d27;border:1px solid #c9c3b7;padding:9px 15px;border-radius:9px;cursor:pointer}.langs button[aria-pressed=true]{background:#403b32;color:white}.panel{margin-top:30px;background:white;border:1px solid #e5e0d6;border-radius:20px;padding:clamp(24px,5vw,45px);box-shadow:0 15px 38px #342c1c0a}h1{font-size:clamp(29px,5vw,43px);line-height:1.15;margin:10px 0 18px}p{line-height:1.6;color:#5b5953}.eyebrow{color:#987a4e;font-size:12px;letter-spacing:.12em;font-weight:700}.question{font-size:clamp(21px,4vw,29px);line-height:1.4;font-weight:600;margin:32px 0}.progress{height:7px;background:#eeeae2;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#a98a5a;transition:width .2s}.choices{display:grid;gap:10px}.choices button{font:inherit;text-align:left;background:#faf9f6;border:1px solid #d9d2c7;border-radius:12px;padding:15px 17px;cursor:pointer;color:#272b29}.choices button.selected{border:2px solid #876b40;background:#f4eee3}.actions{display:flex;gap:12px;align-items:center;margin-top:25px;flex-wrap:wrap}button.primary{font:inherit;background:#403b32;color:white;border:0;border-radius:10px;padding:13px 20px;cursor:pointer}button.secondary{font:inherit;background:transparent;color:#403b32;border:1px solid #c9c3b7;border-radius:10px;padding:12px 20px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.note{font-size:13px;color:#79746a;margin-top:20px}.hidden{display:none}.review{margin:16px 0;padding:12px 15px;background:#f7f4ed;border-radius:9px}.review b{font-weight:600}a{color:#735b37}.footer{margin-top:28px;font-size:13px;color:#6c655b}
.resultbox{border:1px solid #e6e0d5;border-radius:13px;padding:18px;margin:15px 0;background:#faf9f6}.resultbox h3{font-size:16px;margin:0 0 9px}.resultbox p{margin:0}.resulttitle{font-size:clamp(26px,4vw,39px);line-height:1.2}.cta{display:inline-block;background:#403b32;color:white;text-decoration:none;padding:14px 19px;border-radius:10px}.cta:hover{color:white}.question{min-height:100px}</style></head><body><main><div class="top"><div class="brand">CORE9 RESOLVE™</div><div class="langs"><button id="en" aria-pressed="true" onclick="setLang('en')">EN</button><button id="ru" aria-pressed="false" onclick="setLang('ru')">RU</button></div></div><div class="panel"><div class="eyebrow" id="eyebrow"></div><section id="intro"><h1 id="title"></h1><p id="description"></p><button class="primary" id="start" onclick="start()"></button></section><section id="quiz" class="hidden"><div id="counter"></div><div class="progress"><div id="fill"></div></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="actions"><button class="secondary" id="back" onclick="back()"></button><button class="primary" id="next" onclick="next()"></button></div></section><section id="result" class="hidden"><div class="eyebrow" id="resultlabel"></div><h1 class="resulttitle" id="resultTitle"></h1><p id="resultLead"></p><div class="resultbox"><h3 id="strengthLabel"></h3><p id="strengthBody"></p></div><div class="resultbox"><h3 id="focusLabel"></h3><p id="focusBody"></p></div><div class="resultbox"><h3 id="askLabel"></h3><p id="nextQuestion"></p></div><h2 id="invitation"></h2><p id="invitationBody"></p><a class="cta" href="test27.html" id="cta"></a><div class="actions"><button class="secondary" onclick="start()" id="restart"></button></div><p class="note" id="disclaimer"></p></section></div><div class="footer"><a href="index.html" id="home"></a> · <a href="test9_original_ru.html" id="original"></a></div></main><script>
const D={"questions": [{"id": 1, "ru": "Я понимаю, к какому будущему стремлюсь, и принимаю решения, которые приближают меня к нему.", "en": "I know what kind of future I want, and I make decisions that bring me closer to it.", "ru_yes": "Вы умеете держать в поле зрения собственное направление.',no:'Желаемое будущее и повседневные решения могут пока не складываться в одну стратегию.',ask:'Какого результата вы хотите через год и какое решение приблизило бы вас к нему?", "ru_no": "Желаемое будущее и повседневные решения могут пока не складываться в одну стратегию.',ask:'Какого результата вы хотите через год и какое решение приблизило бы вас к нему?", "ru_ask": "Какого результата вы хотите через год и какое решение приблизило бы вас к нему?", "en_yes": "You know how to keep your own direction in sight.", "en_no": "The future you want and the decisions you make each day may not yet fit into one clear direction.", "en_ask": "What result would you like to see a year from now, and what decision would move you closer?"}, {"id": 2, "ru": "Я стараюсь понять людей с другими взглядами и нахожу с ними общий язык.", "en": "I try to understand people whose views differ from mine and find common ground with them.", "ru_yes": "Вы умеете искать взаимопонимание и сотрудничество.',no:'Различия во взглядах могут затруднять взаимопонимание и совместные действия.',ask:'С кем вам важно найти больше взаимопонимания, не отказываясь от себя?", "ru_no": "Различия во взглядах могут затруднять взаимопонимание и совместные действия.',ask:'С кем вам важно найти больше взаимопонимания, не отказываясь от себя?", "ru_ask": "С кем вам важно найти больше взаимопонимания, не отказываясь от себя?", "en_yes": "You know how to seek understanding and cooperation.", "en_no": "Different perspectives may be making mutual understanding and working together more difficult.", "en_ask": "With whom would you like more understanding without losing sight of yourself?"}, {"id": 3, "ru": "Когда что-то не работает, я разбираюсь в причинах и нахожу решение.", "en": "When something isn't working, I look into the causes and find a solution.", "ru_yes": "Вы умеете разбираться в сложном и находить решения.',no:'Может быть трудно увидеть, где именно возникает проблема и как связаны её части.',ask:'В какой ситуации вам сейчас не хватает ясности о причинах происходящего?", "ru_no": "Может быть трудно увидеть, где именно возникает проблема и как связаны её части.',ask:'В какой ситуации вам сейчас не хватает ясности о причинах происходящего?", "ru_ask": "В какой ситуации вам сейчас не хватает ясности о причинах происходящего?", "en_yes": "You can make sense of complex situations and find solutions.", "en_no": "It may be hard to see exactly where a problem starts and how its parts connect.", "en_ask": "Where in your life would understanding what is happening make the biggest difference?"}, {"id": 4, "ru": "Я знаю, что для меня сейчас главное, и уделяю этому время.", "en": "I know what matters most to me right now, and I make time for it.", "ru_yes": "Вы умеете связывать приоритеты с действиями.',no:'Важные цели могут теряться среди срочных задач и чужих запросов.',ask:'Чему вы хотите начать уделять время, а не только считать важным?", "ru_no": "Важные цели могут теряться среди срочных задач и чужих запросов.',ask:'Чему вы хотите начать уделять время, а не только считать важным?", "ru_ask": "Чему вы хотите начать уделять время, а не только считать важным?", "en_yes": "You know how to turn priorities into action.", "en_no": "Important goals may be getting lost among urgent tasks and other people's requests.", "en_ask": "What would you like to start making time for, rather than only considering it important?"}, {"id": 5, "ru": "Я объясняю важные вещи так, что люди понимают меня и мы приходим к договорённостям.", "en": "I explain important things in a way that helps people understand me and reach agreements with me.", "ru_yes": "Вы умеете превращать общение в понимание и договорённости.',no:'Возможно, ваша ценность пока недостаточно понятна другим или разговоры не приводят к нужным договорённостям.',ask:'Кому и какую конкретную пользу вы хотите объяснить яснее?", "ru_no": "Возможно, ваша ценность пока недостаточно понятна другим или разговоры не приводят к нужным договорённостям.',ask:'Кому и какую конкретную пользу вы хотите объяснить яснее?", "ru_ask": "Кому и какую конкретную пользу вы хотите объяснить яснее?", "en_yes": "You can turn conversations into understanding and agreements.", "en_no": "Others may not yet understand the value you bring, or conversations may not lead to the agreements you need.", "en_ask": "Who needs to understand more clearly the specific value you offer?"}, {"id": 6, "ru": "Я забочусь о себе и поддерживаю тепло и уважение в отношениях с близкими.", "en": "I take care of myself and maintain warmth and respect in my relationships with those close to me.", "ru_yes": "Забота и качество отношений — доступная вам сила.',no:'Собственные потребности или качество близких отношений могут требовать внимания.',ask:'Какое маленькое изменение добавило бы заботы и уважения в вашу жизнь?", "ru_no": "Собственные потребности или качество близких отношений могут требовать внимания.',ask:'Какое маленькое изменение добавило бы заботы и уважения в вашу жизнь?", "ru_ask": "Какое маленькое изменение добавило бы заботы и уважения в вашу жизнь?", "en_yes": "Care and the quality of your relationships are strengths you can draw on.", "en_no": "Your own needs or the quality of your closest relationships may need more attention.", "en_ask": "What small change would bring more care and respect into your life?"}, {"id": 7, "ru": "Я занимаюсь тем, что мне по-настоящему интересно, и развиваю свои способности.", "en": "I pursue activities that genuinely interest me and develop my abilities.", "ru_yes": "У вас есть источник интереса и личной реализации.',no:'Возможно, вам пока не хватает пространства для дела, которое даёт смысл и желание развиваться.',ask:'Какая деятельность вызывает у вас подлинный интерес, даже если сейчас на неё мало времени?", "ru_no": "Возможно, вам пока не хватает пространства для дела, которое даёт смысл и желание развиваться.',ask:'Какая деятельность вызывает у вас подлинный интерес, даже если сейчас на неё мало времени?", "ru_ask": "Какая деятельность вызывает у вас подлинный интерес, даже если сейчас на неё мало времени?", "en_yes": "You have a source of genuine interest and personal fulfillment.", "en_no": "You may not have enough room in your life for work that gives you meaning and makes you want to grow.", "en_ask": "What activity genuinely interests you, even if you have little time for it now?"}, {"id": 8, "ru": "Я не только строю планы, но и довожу важные дела до результата.", "en": "I don't just make plans—I follow through on important things and achieve results.", "ru_yes": "Вы умеете превращать намерения в результаты.',no:'Планы могут не превращаться в завершённые дела — стоит проверить организацию действий.',ask:'Какое одно дело вы можете довести до ясного результата?", "ru_no": "Планы могут не превращаться в завершённые дела — стоит проверить организацию действий.',ask:'Какое одно дело вы можете довести до ясного результата?", "ru_ask": "Какое одно дело вы можете довести до ясного результата?", "en_yes": "You know how to turn intentions into results.", "en_no": "Plans may not be turning into finished work. It may help to look at how your actions are organized.", "en_ask": "What is one thing you could bring to a clear, finished result?"}, {"id": 9, "ru": "Когда возникают трудности, я знаю, на что могу опереться, и нахожу необходимую поддержку.", "en": "When difficulties arise, I know what I can rely on and how to find the support I need.", "ru_yes": "Вы умеете находить опору даже при сложностях.',no:'Сейчас может не хватать устойчивой опоры — людей, условий или доступных ресурсов.',ask:'Какая конкретная опора сделала бы вашу жизнь устойчивее уже сейчас?", "ru_no": "Сейчас может не хватать устойчивой опоры — людей, условий или доступных ресурсов.',ask:'Какая конкретная опора сделала бы вашу жизнь устойчивее уже сейчас?", "ru_ask": "Какая конкретная опора сделала бы вашу жизнь устойчивее уже сейчас?", "en_yes": "You know how to find something to rely on, even when things get difficult.", "en_no": "You may need more reliable support—from people, circumstances, or resources you can access.", "en_ask": "What specific support would make your life more stable right now?"}], "insights": [{"id": 1, "ru_title": "Вам важно яснее увидеть направление", "ru_body": "Если вы много решаете повседневных задач, но редко выбираете, к чему хотите прийти, движение может ощущаться как бег по кругу.", "ru_ask": "Какого одного изменения в вашей жизни вы хотите добиться в ближайший год?", "en_title": "You have big dreams. Are you running toward them or waiting for miracles?", "en_body": "When everyday tasks take over, you may feel busy without getting closer to the future you want.", "en_ask": "What one change would you most like to see in your life over the next year?"}, {"id": 2, "ru_title": "Возможно, вам не хватает взаимопонимания", "ru_body": "Когда близкие или коллеги смотрят на ситуацию иначе, даже хорошие идеи могут оставаться без поддержки. Это не означает, что проблема только в вас.", "ru_ask": "С кем вам важнее всего сейчас лучше понять друг друга?", "en_title": "You want to connect with people. Do you feel they really understand you?", "en_body": "When people close to you or at work see things differently, even good ideas can struggle to gain support. That does not mean the problem is yours alone.", "en_ask": "Who would you most like to understand—and feel understood by?"}, {"id": 3, "ru_title": "Возможно, вы устраняете последствия, а не причины", "ru_body": "Одни и те же сложности могут возвращаться, если решение помогает только на короткое время. Полезно разобрать один конкретный повторяющийся случай.", "ru_ask": "Какая проблема возвращается, хотя вы уже пытались её решить?", "en_title": "Does the same problem keep coming back, no matter what you try?", "en_body": "The same difficulty may return when a solution only helps for a short while. One real example is worth exploring.", "en_ask": "What challenge keeps coming back, even after you have tried to solve it?"}, {"id": 4, "ru_title": "Важное может теряться среди срочного", "ru_body": "Дни бывают заполнены делами, а то, что действительно важно вам — доход, отношения или собственный проект, — почти не двигается.", "ru_ask": "Какому своему делу вы давно хотите выделить время, но постоянно откладываете?", "en_title": "Your days are full, but do you have time for what truly matters to you?", "en_body": "Your days may be full, while something important to you—income, relationships, or a personal project—barely moves forward.", "en_ask": "What matters to you but never seems to make it onto your calendar?"}, {"id": 5, "ru_title": "Ваши усилия могут быть не видны другим", "ru_body": "Бывает, что человек много делает, но клиент не понимает ценность услуги, партнёр — ожидания, а близкие — саму просьбу. Здесь стоит проверить, что именно слышат другие.", "ru_ask": "В каком разговоре вам особенно важно быть понятым и договориться о конкретном действии?", "en_title": "You have important things to share. Are people really listening to you?", "en_body": "You may be doing a lot, yet a client, partner, or loved one doesn't understand your value, expectations, or request. What are they actually hearing?", "en_ask": "Where would being understood make the biggest difference?"}, {"id": 6, "ru_title": "Забота о себе или близость могут отходить на второй план", "ru_body": "Работа и обязанности могут идти своим чередом, а на отдых, тепло или разговоры с близкими почти ничего не остаётся.", "ru_ask": "Чего сейчас больше не хватает: заботы о себе или близости с важным человеком?", "en_title": "You're there for everyone else. But do you have someone who supports you?", "en_body": "Work and responsibilities keep moving, while rest, warmth, and meaningful conversations get squeezed out.", "en_ask": "What do you miss more right now: caring for yourself or feeling close to someone important?"}, {"id": 7, "ru_title": "Важное для вас дело может оставаться в стороне", "ru_body": "Можно успешно выполнять обязанности, но долго не возвращаться к тому, что по-настоящему интересно. Это вопрос не только желания, но и условий жизни.", "ru_ask": "Какое занятие вы хотели бы вернуть в свою жизнь хотя бы в небольшом объёме?", "en_title": "Remember what used to excite you? Is your spark still there?", "en_body": "You can meet your obligations and still miss something you genuinely love. Making room for it isn't always just a matter of motivation.", "en_ask": "What would you love to make room for again, even in a small way?"}, {"id": 8, "ru_title": "Планы могут не доходить до результата", "ru_body": "Идей и намерений бывает много, но книга не закончена, проект не запущен, важный шаг в бизнесе откладывается.", "ru_ask": "Какое одно незавершённое дело заметно улучшило бы вашу жизнь, если бы вы его завершили?", "en_title": "You have wonderful ideas. What's stopping you from bringing them to life?", "en_body": "There may be plenty of ideas, but the book remains unfinished, the project unlaunched, or an important business step keeps getting postponed.", "en_ask": "Which unfinished project would make a real difference if you completed it?"}, {"id": 9, "ru_title": "Возможно, вам нужна более надёжная опора", "ru_body": "Когда всё приходится держать на себе, сложнее строить планы, заниматься собой и развивать дело. Иногда первый шаг — не новая цель, а помощь или устойчивые условия.", "ru_ask": "Какая поддержка или какое изменение условий облегчили бы вам жизнь уже сейчас?", "en_title": "You don't have to do everything alone. Who can you count on?", "en_body": "When everything rests on your shoulders, it's harder to plan, take care of yourself, or grow. Sometimes the first step is support, not another goal.", "en_ask": "What kind of support would make life easier right now?"}], "tensions": [{"yes": 1, "no": 8, "ru_title": "Направление есть — а результат задерживается", "ru_lead": "Вы представляете, куда хотите прийти, но не всегда доводите важные дела до конца.", "ru_focus": "Это знакомо людям с большими планами: стратегия есть, а книга, проект или новое направление бизнеса всё ещё ждут завершения. Сначала стоит проверить, что именно останавливает работу.", "ru_ask": "Какое одно дело даст вам самый заметный результат, если вы доведёте его до конца?", "en_title": "You know exactly where you want to go. So why does getting there sometimes feel slower than you'd like?", "en_lead": "You can picture where you want to go, but important things may not always get finished.", "en_focus": "A clear vision is a strength. Let’s explore what might be slowing the next step rather than assume it is a lack of effort.", "en_ask": "Which one unfinished task would make the biggest difference if you completed it?"}, {"yes": 7, "no": 8, "ru_title": "Любимое дело есть — воплощения пока меньше", "ru_lead": "Вы чувствуете интерес и развиваете способности, но не всегда превращаете это в завершённую работу.", "ru_focus": "Вдохновение помогает начать. Для книги, программы или нового продукта может потребоваться иной ритм и организация — или больше доступных ресурсов.", "ru_ask": "Какой первый законченный результат вы могли бы показать другому человеку?", "en_title": "Your ideas are bursting with life! What happens between that first spark and the finish line?", "en_lead": "You have real interests and talents, but they do not always turn into finished work.", "en_focus": "Inspiration gets things started. Finishing a book, program, or product may also take a different rhythm, structure, or resources.", "en_ask": "What is one small finished result you could show someone?"}, {"yes": 3, "no": 4, "ru_title": "Вы находите решения — но своё главное откладываете", "ru_lead": "Вам удаётся разбираться в проблемах, однако важные лично для вас дела могут ждать своей очереди.", "ru_focus": "Можно отлично помогать другим и всё же не находить времени для собственного проекта, карьеры или отношений.", "ru_ask": "Что вы хотите поставить в расписание на ближайшую неделю ради собственной цели?", "en_title": "You're everyone's favorite problem-solver. But who's solving the problems that matter to you?", "en_lead": "You are good at solving problems, yet your own priorities may keep getting postponed.", "en_focus": "It is possible to be the person everyone relies on and still have little time for your own goals.", "en_ask": "What could you put on your calendar next week for a goal of your own?"}, {"yes": 5, "no": 2, "ru_title": "Вы умеете договариваться — но понимания может не хватать", "ru_lead": "Разговоры и решения у вас получаются, однако с людьми иных взглядов не всегда складывается настоящий контакт.", "ru_focus": "Договориться о задаче и почувствовать себя услышанным — разные вещи. Особенно это заметно в близких отношениях и партнёрстве.", "ru_ask": "С кем полезнее сначала разобраться в точках зрения, а уже потом искать решение?", "en_title": "You know how to get a “yes.” But are you getting the understanding you really want?", "en_lead": "You can reach agreements, but understanding people with different perspectives may be harder.", "en_focus": "Agreeing on a task and truly understanding one another are different things—especially in close relationships.", "en_ask": "Who might you understand better before trying to find a solution together?"}, {"yes": 8, "no": 6, "ru_title": "Вы многое успеваете — а на себя может не оставаться сил", "ru_lead": "Вы доводите дела до результата, но забота о себе и близких может уходить на второй план.", "ru_focus": "Работа и обязательства могут выполняться успешно, хотя отдых, тепло и отношения постепенно получают меньше внимания.", "ru_ask": "Какой небольшой шаг поможет сохранить результат, не жертвуя собой или важными отношениями?", "en_title": "You're accomplishing so much! But is your success giving you more life—or taking more out of you?", "en_lead": "You follow through, but your own needs and close relationships may be getting less attention.", "en_focus": "Work and obligations may be going well, even as rest, warmth, and connection get less attention.", "en_ask": "What small change could protect both your results and your well-being?"}, {"yes": 1, "no": 9, "ru_title": "Вы видите будущее — но опора пока непрочна", "ru_lead": "У вас есть направление, однако необходимые условия или поддержка не всегда доступны.", "ru_focus": "Большая цель становится труднее, если не хватает времени, денег, помощи или предсказуемости. Это не обязательно недостаток ваших способностей.", "ru_ask": "Какая опора нужна, прежде чем делать следующий большой шаг?", "en_title": "You can picture an exciting future. Who's helping you turn that picture into reality?", "en_lead": "You know your direction, but the conditions or help you need may not always be available.", "en_focus": "A big goal is harder without time, money, help, or stability. That does not necessarily reflect your abilities.", "en_ask": "What support would make your next big step possible?"}, {"yes": 3, "no": 5, "ru_title": "Вы знаете, как решить задачу — но вас могут не слышать", "ru_lead": "Вы разбираетесь в сложных ситуациях, но вам не всегда удаётся донести свои выводы до других.", "ru_focus": "Хорошее решение ещё нужно объяснить клиенту, коллеге или близкому так, чтобы его можно было вместе воплотить.", "ru_ask": "Кому сейчас важно объяснить не вашу идею вообще, а её конкретную пользу?", "en_title": "You found the answer! So why isn't everyone jumping on board?", "en_lead": "You can make sense of difficult situations, but getting your ideas across may be harder.", "en_focus": "Even a strong solution needs to be understood before people can act on it together.", "en_ask": "Who needs to hear the practical value of your idea more clearly?"}], "special": {"all_yes": {"ru_title": "Вы узнаёте в себе все девять опор", "ru_lead": "Вы отметили, что видите направление, умеете действовать и находить общий язык с людьми. Но какие из этих сильных сторон дают результат именно там, где он вам сейчас нужен?", "ru_strength": "В ваших ответах нет очевидной области, которую вы сами считаете слабой. Это хороший повод сравнить ощущения с реальными результатами — в доходе, отношениях, самочувствии или своих проектах.", "ru_focus": "Возможно, вы хорошо справляетесь с делами, но хотели бы большего: устойчивого дохода, времени для близких или собственного завершённого проекта.", "ru_ask": "В какой сфере вы хотите большего результата, даже если сейчас многое получается?", "en_title": "You have so much going for you. Are you getting the life you really want?", "en_lead": "You recognize all nine strengths in yourself. But are they bringing you the results that matter most?", "en_strength": "Your answers do not point to an obvious weak area. It may be useful to compare your sense of what works with your actual results—in relationships, work, well-being, and personal projects.", "en_focus": "Even when things are going well, you may want more: steadier income, more time for loved ones, or a project of your own brought to life.", "en_ask": "Where would you like a better result, even if much is already going well?"}, "all_no": {"ru_title": "Сейчас многое может требовать от вас слишком больших усилий", "ru_lead": "Вы не узнали себя ни в одном утверждении. Это не означает, что у вас нет способностей. Возможно, условия или нагрузка сейчас мешают ими пользоваться.", "ru_strength": "Вы уже сделали важное: обозначили, что текущая ситуация не похожа на ту, которой вы хотите. Следующий шаг — выбрать одну жизненную задачу вместо попытки менять всё сразу.", "ru_focus": "Стоит начать с самого ощутимого: чего не хватает больше — надёжной поддержки, времени, понятного плана или возможности заняться собой?", "ru_ask": "Какое одно изменение принесло бы вам заметное облегчение в ближайший месяц?", "en_title": "What if you have more inside you than you can see right now?", "en_lead": "None of these statements felt true for you right now. That does not mean you lack ability. Your current circumstances or demands may make your strengths harder to use.", "en_strength": "You have identified something important: life as it is now may not match what you want. You do not have to change everything at once.", "en_focus": "What would help most right now: reliable support, more time, a clearer plan, or room to take care of yourself?", "en_ask": "What one change would bring you noticeable relief this month?"}, "mixed": {"ru_lead": "В одних ситуациях вы узнаёте свои сильные стороны, а в других пока не получаете желаемого. Вот направление, которое имеет смысл исследовать первым.", "en_lead": "Some things come naturally to you, while other results may not be where you want them yet. Here is one area worth exploring first."}}};let lang='en',pos=0,answers=Array(9).fill(null),mode='intro';const $=id=>document.getElementById(id);const words={en:{title:'What helps you get the results you want?',intro:'Not another personality test. Nine quick questions to discover what you can rely on—and what might deserve a closer look.',start:'Discover your result',question:'Question',back:'Back',next:'Next',finish:'See my result',yes:'Yes',no:'No',resultlabel:'YOUR FIRST DISCOVERY',strength:'A strength you can draw on',focus:'Something worth exploring',ask:'A question just for you',invite:'Curious what else your answers might reveal?',inviteBody:'Nine questions are just the beginning. Discover how your strengths, actions, and results connect—and where something may be getting in the way.',cta:'Explore more about yourself',restart:'Take the test again',disclaimer:'Based only on your Yes/No answers. This result does not establish causes or provide a medical or psychological diagnosis.',home:'All assessments',original:'Original Russian test',alert:'Choose an answer to continue.'},ru:{title:'Почему ваши усилия не всегда дают тот результат, которого вы хотите?',intro:'У вас уже могут быть сильные способности, которые не работают на ваши цели. За 9 коротких вопросов вы увидите, на что можете опереться и где стоит искать препятствие.',start:'Начать тест',question:'Вопрос',back:'Назад',next:'Далее',finish:'Узнать результат',yes:'Да',no:'Нет',resultlabel:'ВАШ ПЕРВЫЙ РЕЗУЛЬТАТ · CORE9',strength:'То, на что вы уже можете опереться',focus:'Что стоит проверить',ask:'Ваш следующий полезный вопрос',invite:'Узнали что-то знакомое?',inviteBody:'Девять ответов показывают лишь первый контур. Более глубокий тест CORE9 поможет увидеть, что происходит между вашими способностями, действиями и реальными результатами — в здоровье, отношениях, деньгах или творчестве.',cta:'Исследовать свой результат глубже',restart:'Пройти ещё раз',disclaimer:'Результат основан только на ваших ответах «Да/Нет». Он не устанавливает причины трудностей и не является медицинской или психологической диагностикой.',home:'Все тесты',original:'Исходный русский тест',alert:'Выберите ответ.'}};function setLang(x){lang=x;document.documentElement.lang=x;render()}function start(){pos=0;answers=Array(9).fill(null);mode='quiz';render()}function back(){if(pos>0)pos--;else mode='intro';render()}function choose(x){answers[pos]=x;render()}function next(){if(answers[pos]===null){alert(words[lang].alert);return}if(pos===8)mode='result';else pos++;render()}function result(){const yes=new Set(D.questions.filter((q,i)=>answers[i]==='yes').map(q=>q.id));const no=new Set(D.questions.filter((q,i)=>answers[i]==='no').map(q=>q.id));const p=lang+'_';let v={};if(no.size===0){v=D.special.all_yes}else if(yes.size===0){v=D.special.all_no}else{const t=D.tensions.find(t=>yes.has(t.yes)&&no.has(t.no));if(t){v={[p+'title']:t[p+'title'],[p+'lead']:t[p+'lead'],[p+'strength']:D.questions[t.yes-1][p+'yes'],[p+'focus']:t[p+'focus'],[p+'ask']:t[p+'ask']}}else{const priority=[8,4,9,5,6,2,7,3,1],target=priority.find(i=>no.has(i)),strength=[3,2,7,...Array.from(yes)].find(i=>yes.has(i));v={[p+'title']:D.insights[target-1][p+'title'],[p+'lead']:D.special.mixed[p+'lead'],[p+'strength']:D.questions[strength-1][p+'yes'],[p+'focus']:D.insights[target-1][p+'body'],[p+'ask']:D.insights[target-1][p+'ask']}}}for(const [id,key] of [['resultTitle','title'],['resultLead','lead'],['strengthBody','strength'],['focusBody','focus'],['nextQuestion','ask']])$(id).textContent=v[p+key]||'';}function render(){const w=words[lang];$('en').setAttribute('aria-pressed',lang==='en');$('ru').setAttribute('aria-pressed',lang==='ru');$('eyebrow').textContent=lang==='en'?'9 QUESTIONS · YES / NO · ABOUT 2 MINUTES':'9 ВОПРОСОВ · ДА / НЕТ · ≈ 2 МИНУТЫ';$('title').textContent=w.title;$('description').textContent=w.intro;$('start').textContent=w.start;for(const id of ['intro','quiz','result'])$(id).classList.toggle('hidden',mode!==id);for(const [id,key] of [['resultlabel','resultlabel'],['strengthLabel','strength'],['focusLabel','focus'],['askLabel','ask'],['invitation','invite'],['invitationBody','inviteBody'],['cta','cta'],['restart','restart'],['disclaimer','disclaimer'],['home','home'],['original','original']])$(id).textContent=w[key];if(mode==='quiz'){$('counter').textContent=w.question+' '+(pos+1)+' / 9';$('fill').style.width=((pos+1)*100/9)+'%';$('question').textContent=D.questions[pos][lang];$('choices').replaceChildren();for(const x of ['yes','no']){const b=document.createElement('button');b.textContent=w[x];b.className=answers[pos]===x?'selected':'';b.onclick=()=>choose(x);$('choices').append(b)}$('back').textContent=w.back;$('next').textContent=pos===8?w.finish:w.next}if(mode==='result')result()}render();</script></body></html>
