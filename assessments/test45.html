  <script>/* CORE9 Business45: auditable exploratory rules, not validated diagnostics.
0 present, 1 sometimes, 2 absent, 3 not applicable.
No financial or causal inference; trace each observation to answer codes. */
    (function (g) {
      'use strict';
      const labels = {
        en: ['Strategic vision', 'Collaboration', 'Systems analysis', 'Priorities', 'Communication', 'Creative flow', 'Initiative', 'Execution', 'Renewal'],
        ru: ['Стратегическое видение', 'Сотрудничество', 'Системный анализ', 'Приоритеты', 'Коммуникация', 'Творческий поток', 'Инициатива', 'Реализация', 'Обновление']
      };
      const notes = {
        en: {
          strength: 'You report consistent practices in this area.',
          attention: 'Several answers suggest this area deserves a closer look.',
          partial: 'Your answers suggest uneven implementation in this area.',
          noEvidence: 'Your responses do not yet support a clear ranking. Start by reviewing the individual answers.',
          risk: 'An area worth examining first',
          opportunity: 'A strength you may be able to build on',
          start: 'Review the specific practices marked as absent or inconsistent, and identify what can be checked next.',
          stage: 'For a business not yet operating, these answers reflect plans and readiness, not proven results.',
          neutral: 'Your answers highlight practices to explore. They do not establish why any problem occurs.'
        },
        ru: {
          strength: 'По вашим ответам, практики в этой области применяются последовательно.',
          attention: 'Несколько ответов показывают, что эту область стоит изучить подробнее.',
          partial: 'По вашим ответам, практики в этой области применяются не всегда.',
          noEvidence: 'Ответов пока недостаточно для уверенного выделения приоритетов. Начните с отдельных утверждений.',
          risk: 'Область для первоочередного изучения',
          opportunity: 'Сильная сторона, на которую можно опереться',
          start: 'Проверьте конкретные практики, отмеченные как отсутствующие или непоследовательные, и определите следующий шаг.',
          stage: 'Если бизнес ещё не работает, ответы описывают планы и готовность, а не подтверждённые результаты.',
          neutral: 'Ответы помогают определить темы для изучения, но не объясняют причины проблем.'
        }
      };
      function evaluate(answers, stage = 'operating') {
        if (!Array.isArray(answers) || answers.length !== 45 || answers.some(x => ![0, 1, 2, 3].includes(x))) throw Error('45 completed answers required');
        const functions = Array.from({ length: 9 }, (_, i) => {
          const responses = answers.slice(i * 5, i * 5 + 5), applicable = responses.filter(x => x !== 3).length;
          const yes = responses.filter(x => x === 0).length, sometimes = responses.filter(x => x === 1).length, no = responses.filter(x => x === 2).length;
          const strength = applicable >= 3 && yes >= 3 && no <= 1;
          const concern = applicable >= 3 && (no >= 2 || (no >= 1 && sometimes >= 2));
          const evidence = responses.map((a, j) => ({ code: `${i + 1}.${j + 1}`, response: a })).filter(x => x.response !== 3);
          return { id: i + 1, applicable, yes, sometimes, no, strength, concern, evidence };
        });
        const strengths = functions.filter(f => f.strength).sort((a, b) => b.yes - a.yes || a.no - b.no || a.id - b.id).slice(0, 5);
        const concerns = functions.filter(f => f.concern).sort((a, b) => b.no - a.no || b.sometimes - a.sometimes || a.id - b.id).slice(0, 5);
        return {
          stage, functions, strengths, concerns, lowEvidence: strengths.length === 0 && concerns.length === 0,
          answered: 45, applicable: answers.filter(x => x !== 3).length
        };
      }
      function report(data, lang = 'en') {
        const t = notes[lang], names = labels[lang], fmt = f => ({
          title: names[f.id - 1], text: f.concern ? t.attention : t.strength,
          codes: f.evidence.filter(e => f.concern ? e.response === 1 || e.response === 2 : e.response === 0).map(e => e.code)
        });
        return {
          strengths: data.strengths.map(fmt), concerns: data.concerns.map(fmt),
          risk: data.concerns.length ? { title: names[data.concerns[0].id - 1], text: t.risk } : null,
          opportunity: data.strengths.length ? { title: names[data.strengths[0].id - 1], text: t.opportunity } : null,
          note: data.lowEvidence ? t.noEvidence : t.neutral, step: t.start,
          stageNote: data.stage === 'prelaunch' ? t.stage : null
        };
      }
      g.CORE9Business45 = { evaluate, report };
    })(typeof globalThis !== 'undefined' ? globalThis : this);
  </script>

heir interests to achieve it.", "approval_status": "Утверждено" }, { "code": "2.2", "ru": "В нашей организации умеют устанавливать доверительные отношения, учитывать различия между людьми и находить взаимоприемлемые решения", "en": "People in our organization know how to build trust, respect differences, and find mutually acceptable solutions.", "approval_status": "Утверждено" }, { "code": "2.3", "ru": "В нашей организации действует система открытого взаимодействия, которая помогает сотрудникам и подразделениям обсуждать разногласия и осваивать способы их мирного разрешения", "en": "Our organization has an open system of communication that helps employees and departments discuss disagreements and learn to resolve them peacefully.", "approval_status": "Утверждено 5 ноября 2026" }, { "code": "2.4", "ru": "Мы подбираем людям роли с учётом их способностей и подготовки, а обучение и наставничество помогают им осваивать необходимые задачи", "en": "We assign roles based on people's abilities and preparation, while training and mentoring help them master the tasks required.", "approval_status": "Утверждено" }, { "code": "2.5", "ru": "В нашей организации логика выбора продуктов и рыночных возможностей ясно доводится до всех участников, помогая им понимать ценность нашего предложения и поддерживать единый образ бренда", "en": "Our organization clearly communicates the reasoning behind product choices and market opportunities to everyone involved, helping them understand the value of our offering and maintain a consistent brand identity.", "approval_status": "Утверждено 5 ноября 2026" }, { "code": "3.1", "ru": "Мы оцениваем, насколько структура нашей организации и взаимодействие её основных функций соответствуют выбранной стратегии развития", "en": "We assess whether our organizational structure and the interaction of its core functions support our chosen growth strategy.", "approval_status": "Утверждено 05.11.2026" }, { "code": "3.2", "ru": "Наша система взаимодействия учитывает особенности сотрудников и подразделений, обеспечивая согласованность их работы", "en": "Our system of collaboration takes account of the characteristics of employees and departments, helping them work in a coordinated way.", "approval_status": "Утверждено 05.11.2026" }, { "code": "3.3", "ru": "В нашей организации регулярно анализируют работу всей системы, выявляют взаимосвязи между её элементами и своевременно вносят необходимые изменения", "en": "Our organization regularly examines how the entire system works, identifies connections among its parts, and makes necessary changes in a timely manner.", "approval_status": "Утверждено" }, { "code": "3.4", "ru": "Прежде чем менять порядок работы, мы анализируем, какие изменения наиболее важны для устойчивости и развития всей системы", "en": "Before changing how we work, we analyze which changes matter most for the stability and development of the entire system.", "approval_status": "Утверждено 05.11.2026" }, { "code": "3.5", "ru": "Результаты системного анализа мы превращаем в понятные рекомендации и передаём участникам деятельности для согласованного применения", "en": "We turn the findings of systems analysis into clear recommendations and share them with the people involved so they can act in a coordinated way.", "approval_status": "Утверждено 05.11.2026" }, { "code": "4.1", "ru": "При выборе направлений развития мы определяем, какие возможности действительно соответствуют долгосрочным целям нашей организации", "en": "When choosing directions for growth, we identify which opportunities genuinely align with our organization's long-term goals.", "approval_status": "Утверждено" }, { "code": "4.2", "ru": "При определении первоочередных задач мы учитываем возможности, интересы и готовность людей, от которых зависит их выполнение", "en": "When setting immediate priorities, we consider the capabilities, interests, and readiness of the people responsible for carrying them out.", "approval_status": "Утверждено" }, { "code":
